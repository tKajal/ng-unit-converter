<div class="blog-detail" *ngIf="blog">
  <div class="hero-section">
    <h1 class="title">{{ blog?.title }}</h1>

    <div class="meta">
      <span>📅 {{ blog?.date }}</span>
      <span>✍️ {{ blog?.author }}</span>
      <span>⏱ {{ blog?.readTime }}</span>
    </div>
  </div>

  <div class="blog-content">
    <p *ngFor="let para of blog.content">{{ para }}</p>
  </div>

  <div class="blog-footer">
    <a routerLink="/blog" class="back-link">← Back to All Blogs</a>
  </div>
</div>
